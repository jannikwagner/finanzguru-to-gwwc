[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwwc_import"
version = "0.1.0"
description = "Import Finanzguru donation transactions into the EffectiveAltruism.org My Giving dashboard via Playwright."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "jannikwagner" }]
keywords = ["donations", "finanzguru", "gwwc", "effective-altruism", "playwright"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.6",
  "playwright>=1.40",
  "python-dotenv>=1.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.13",
  "pandas-stubs>=2.0",
  "poethepoet>=0.45.0",
]

[project.scripts]
gwwc_import = "gwwc_import.cli:main"

[project.urls]
Repository = "https://github.com/jannikwagner/finanzguru-to-gwwc"

[tool.hatch.build.targets.wheel]
packages = ["gwwc_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.poe.tasks]
format  = "ruff format gwwc_import/ tests/"
lint    = "ruff check --fix gwwc_import/ tests/"
type    = "mypy gwwc_import/"
test    = "pytest tests/ -v"
ci.sequence = ["format", "lint", "type", "test"]
ci.ignore_fail = "return_non_zero"
